[package]
name = "tilvisan"
version = "0.2.0"
edition = "2021"
description = "A variable font autohinter"
license = "Apache-2.0"
homepage = "https://github.com/simoncozens/tilvisan"
repository = "https://github.com/simoncozens/tilvisan"

[[bin]]
name = "tilvisan"
path = "src/main.rs"

[dependencies]
write-fonts = { version = "0.53.0", features = [ "read", ] }
skrifa = { version = "0.47.0" }
chrono = "0.4.44"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
log = "0.4"
logos = "0.14"
paste = "1.0.15"
thiserror = "2.0.18"
env_logger = "0.11.10"
indexmap = "2.13.1"

[dev-dependencies]
glob = "0.3.3"
libtest-mimic = "0.8.2"
similar = "2.7.0"

[[test]]
name = "integration_test"
harness = false

[lints.clippy]
chunks_exact_to_as_chunks = "allow" # Solution is uglier than problem
